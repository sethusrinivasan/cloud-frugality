name: Cloud Frugality CI & AWS Post-Deployment Liveliness

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Build, Pytest, Rust Tests & TLA+ Formal Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java 21 for TLA+ TLC Model Checker
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install duckdb boto3 pytest typeguard requests

      - name: Run Rust Cargo Tests
        run: |
          cargo test --manifest-path src/rust/Cargo.toml --verbose

      - name: Run Pytest Test Suite
        run: |
          pytest -v -k "not test_live_audit"

      - name: Verify TLA+ Engine Switch Specification with TLC Model Checker
        run: |
          chmod +x scripts/verify_tla.sh
          ./scripts/verify_tla.sh

      - name: Immediate Liveliness Audit on AWS Python Function URL
        run: |
          COST_WEB_URL="https://onj5dz36ffvwsx2nhwyrhrufle0zyhha.lambda-url.us-east-2.on.aws/" pytest tests/test_live_audit.py -k "test_live_web_dashboard or test_live_json_api or test_live_runtime_identity" -v

      - name: Immediate Liveliness Audit on AWS Rust Function URL
        run: |
          COST_WEB_URL="https://2to4pjbhoo6rbtmfjxomrokzfq0ylovp.lambda-url.us-east-2.on.aws/" pytest tests/test_live_audit.py -k "test_live_web_dashboard or test_live_json_api or test_live_runtime_identity" -v

  post-deployment-liveliness-30m:
    name: 30-Minute Post-Deployment Liveliness & Cold-Start Stability Audit
    runs-on: ubuntu-latest
    needs: [test-and-verify]
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests boto3 duckdb typeguard

      - name: Delay 30 Minutes for AWS Deployment Burn-In & Cold Start Audit
        run: |
          echo "=========================================================================="
          echo "  Initiating 30-minute burn-in window (1800s) post-deployment..."
          echo "  Ensures zero cold-start degradation, persistent S3 storage integrity,"
          echo "  and verifies engine switcher URLs retain zero-localhost safety guarantees."
          echo "=========================================================================="
          sleep 1800
          echo "30-minute delay complete. Executing deep liveliness audit."

      - name: Audit AWS Python Endpoint (30m Post-Deployment)
        run: |
          COST_WEB_URL="https://onj5dz36ffvwsx2nhwyrhrufle0zyhha.lambda-url.us-east-2.on.aws/" pytest tests/test_live_audit.py -k "test_live_web_dashboard or test_live_json_api or test_live_runtime_identity" -v

      - name: Audit AWS Rust Endpoint (30m Post-Deployment)
        run: |
          COST_WEB_URL="https://2to4pjbhoo6rbtmfjxomrokzfq0ylovp.lambda-url.us-east-2.on.aws/" pytest tests/test_live_audit.py -k "test_live_web_dashboard or test_live_json_api or test_live_runtime_identity" -v
